name: vibeflow-platform

# VibeFlow Studio Web 版 — 基础设施编排
# 组件：Postgres（元数据）/ Redis（队列+事件扇出）/ SeaweedFS（S3 对象存储）
# 启动：docker compose -f infra/docker-compose.yml up -d
# 备注：MinIO 社区版已归档停服（dl.min.io 410），故选 SeaweedFS（S3 兼容、活跃维护）

services:
  postgres:
    image: postgres:16-alpine
    container_name: vibeflow-postgres
    environment:
      POSTGRES_USER: vibeflow
      POSTGRES_PASSWORD: vibeflow_dev_pwd
      POSTGRES_DB: vibeflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibeflow"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: vibeflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # SeaweedFS：单容器 all-in-one（master+volume+filer+s3 gateway）
  # S3 endpoint: http://localhost:8333 （boto3 兼容）
  # filer（类文件系统视图）: http://localhost:8888
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    container_name: vibeflow-s3
    command: >-
      server -s3 -s3.port=8333 -filer -filer.port=8888
      -master.port=9333 -volume.port=8081
      -dir=/data -metricsPort=0
    ports:
      - "8333:8333"   # S3 API
      - "8888:8888"   # filer HTTP
      - "9333:9333"   # master（排障用）
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  redisdata:
  s3data:
