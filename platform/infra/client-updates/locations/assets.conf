location = /vibeflow-version.json {
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
  try_files $uri =404;
}

location /assets/ {
  add_header Cache-Control "public, max-age=31536000, immutable";
  add_header X-Content-Type-Options "nosniff" always;
  try_files $uri @previous_client_assets;
}

location @previous_client_assets {
  root /opt/vibeflow-client/active/previous;
  add_header Cache-Control "public, max-age=31536000, immutable";
  add_header X-Content-Type-Options "nosniff" always;
  try_files $uri =404;
}
