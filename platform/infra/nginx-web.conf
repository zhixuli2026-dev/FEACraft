# nginx：前端静态 + /api /ws /viz-proxy 反代到 api 服务（WS 升级头齐全）
# Docker service addresses may change when Compose replaces a container.
# Nginx >= 1.27.3 supports dynamic upstream resolution in the open-source build.
upstream api_backend {
  zone api_backend 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  include /etc/nginx/vibeflow-upstreams/api.conf;
}

# 只记录路径。Referer 也可能包含查询参数。
log_format vibeflow_noquery '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                            '"$http_user_agent"';

map $host $vf_frontend_root {
  include /etc/nginx/vibeflow-client/maps/*.conf;
  default /usr/share/nginx/html;
}

server {
  listen 80;
  include /etc/nginx/vibeflow-tls/*.conf;
  # Largest API upload: 100 MiB workspace ZIP plus 1 MiB multipart framing.
  # Smaller endpoint limits remain enforced by the API before spool growth.
  client_max_body_size 101m;
  proxy_connect_timeout 3s;
  access_log /var/log/nginx/access.log vibeflow_noquery;
  root $vf_frontend_root;
  index index.html;

  location /api/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
  location /ws/ {
    # Standard upstream error messages include the raw request line.
    error_log /var/log/nginx/error.log crit;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
  location /viz-proxy/ {
    error_log /var/log/nginx/error.log crit;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
  location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' ws: wss:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  include /etc/nginx/vibeflow-client/locations/*.conf;
}
